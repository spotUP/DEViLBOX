# Shared ld65 layout: 32 KB PRG (8 x 4 KB banks, mapper 31 or NROM-256), no CHR.
MEMORY {
  HDR: start=$0000, size=16, fill=yes, file=%O;
  PRG: start=$8000, size=$8000, fill=yes, file=%O;
}
SEGMENTS {
  HEADER: load=HDR, type=ro;
  BANK0:  load=PRG, type=ro, start=$8000, optional=yes;
  BANK1:  load=PRG, type=ro, start=$9000, optional=yes;
  BANK4:  load=PRG, type=ro, start=$C000, optional=yes;
  BANK5:  load=PRG, type=ro, start=$D000, optional=yes;
  CODE:   load=PRG, type=ro, start=$F000;
  VECTORS: load=PRG, type=ro, start=$FFFA;
}
