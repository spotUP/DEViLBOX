services:
  # Backend API
  backend:
    container_name: devilbox-backend
    # CI builds and ships this tag (release asset devilbox-backend.tar.gz);
    # the deploy script loads it and restarts the service without a build.
    image: devilbox-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Genre lookup (GET /api/genre/:key): ModArchive key and monthly request budget.
      - MODARCHIVE_API_KEY=${MODARCHIVE_API_KEY:-}
      - MODARCHIVE_MONTHLY_BUDGET=${MODARCHIVE_MONTHLY_BUDGET:-8000}
      # Live chain is Caddy -> nginx -> backend: two proxy hops, so req.ip is
      # the visitor and the per-IP AI limits are per visitor.
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-2}
      - CORS_ORIGIN=https://devilbox.uprough.net
      - DATA_ROOT=/data
      - DB_DIR=/data/db
    volumes:
      # Persistent data volume for user files and database
      - devilbox-data:/data
    networks:
      - devilbox-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend (Nginx)
  frontend:
    container_name: devilbox-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=https://devilbox.uprough.net/api
    restart: unless-stopped
    ports:
      - "8080:80"  # Host:Container - Changed to 8080 to avoid conflict
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devilbox-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  # Named volume for persistent data
  devilbox-data:
    driver: local

networks:
  devilbox-network:
    driver: bridge
