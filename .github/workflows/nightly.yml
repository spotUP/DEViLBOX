name: Nightly regression

# Runs once a day against main. Catches regressions that slip between pushes
# (e.g. a dependency update shipping via Dependabot, or a subtle flake that
# only surfaces after several runs).
#
# TODO(infra): when self-hosted runners with the Reference Music tree and a
# headless Chromium are available, extend this workflow with:
#   - `npm run test:playback` (requires dev server at :5173 + MCP relay :4003)
#   - `npm run test:furnace`  (requires upstream Furnace CLI on PATH)
#   - `npm run test:ui-smoke` (Puppeteer flows — Phase 3.1)
# Until then, the nightly job reinforces the push-gate tests and surfaces
# new engine contract drift via the lifecycle allowlist.

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # test:ci exercises server code (the analysis cache round trip opens the
      # real SQLite database), so the server's own dependencies must exist here
      # as they do in deploy.yml. Without them better-sqlite3 does not resolve
      # and serverAnalysisStoresTheExtendedAnalysis fails before it runs.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Type check
        run: npm run type-check

      - name: CI regression gate
        run: npm run test:ci

      - name: Effects compliance
        run: npm run test:compliance

      # Offline-render suites of 15 s or more in CI (tools/test-tiers/heavy.json).
      # They left the per-push fast tier on 2026-10-11 (CI took about 2 h).
      - name: Heavy tier (offline renders)
        run: npm run test:heavy
        env:
          VITEST_MAX_WORKERS: '2'

      # The full unit suite (many parsers need Reference Music/ locally) is
      # skipped on GitHub-hosted runners. Run locally before release:
      #   npm test
