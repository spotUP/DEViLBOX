name: Build & Deploy DEViLBOX

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'deploy'
  cancel-in-progress: true

jobs:
  # Build for custom server with / base
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history (commits only, no old trees or blobs): the
          # changelog and BUILD_NUMBER count commits, a shallow clone counts 1.
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # test:ci exercises server code (the analysis cache round trip opens the
      # real SQLite database), so the server's own dependencies must exist here
      # as they do in every local checkout. Without them better-sqlite3 does not
      # resolve and the suite fails before it runs.
      - name: Install server dependencies
        run: npm ci --prefix server

      # Preset banks live in their own public repo; the Vital preset suites need them.
      - name: Fetch preset banks for tests
        run: git clone --depth 1 https://github.com/spotUP/devilbox-presets.git public/data/presets

      # CI-safe tests only. Fixture-dependent parser tests (that read from the
      # local `Reference Music/` tree) still run locally via `npm test`, not here.
      - name: Type check
        run: npm run type-check

      # Two workers on the 4-core runner, as the local gate runs two on eight:
      # an offline audio render holds the worker, its render thread and its
      # worklet thread, so four workers oversubscribed the four cores and the
      # dub-bus rig renders ran 9-10x their local time (dubBus.behaviour 265 s
      # against 29 s, madProfessorTrebleBursts past 180 s against 22 s) and hit
      # their timeouts.
      - name: CI regression gate
        run: npm run test:ci
        env:
          VITEST_MAX_WORKERS: '2'

      # The server's suites live under server/ with their own vitest config
      # (node environment, src/**/*.test.ts from server/); test:ci runs the
      # root config, whose include is src/** of the client, so it never ran them.
      - name: Server tests
        run: npm test --prefix server

      - name: Effects compliance
        run: npm run test:compliance

      - name: Download CED instrument classifier model
        run: |
          mkdir -p public/models/ced
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://huggingface.co/mispeech/ced-base/resolve/main/model.onnx" \
            -o public/models/ced/model.onnx
          curl -L --fail --retry 3 \
            "https://huggingface.co/mispeech/ced-base/resolve/main/config.json" \
            -o public/models/ced/config.json
          echo "CED model: $(du -sh public/models/ced/model.onnx)"

      # SwiftF0 pitch tracker for Voice to Notes (MIT, lars76/swift-f0, 135,090 bytes).
      - name: Download SwiftF0 pitch model
        run: |
          mkdir -p public/models/swift-f0
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/lars76/swift-f0/d1ba77fe5331310b778ebe126b6cb3656d41d24f/swift_f0/model.onnx" \
            -o public/models/swift-f0/model.onnx
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/lars76/swift-f0/d1ba77fe5331310b778ebe126b6cb3656d41d24f/LICENSE" \
            -o public/models/swift-f0/LICENSE
          test "$(wc -c < public/models/swift-f0/model.onnx)" -eq 135090

      # The banks are served by the server from its own clone, not from the dist tarball.
      - name: Drop preset banks from the build input
        run: rm -rf public/data/presets

      - name: Build for custom server
        run: npm run build

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: dist/

  # Build Electron desktop apps for all platforms
  # Backend API image: built here so a broken Dockerfile fails CI, shipped
  # as a release asset that the server's deploy script loads.
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t devilbox-backend:latest .

      - name: Save backend image
        run: docker save devilbox-backend:latest | gzip > devilbox-backend.tar.gz

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: devilbox-backend.tar.gz

  electron:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full commit history (commits only, no old trees or blobs): the
          # changelog and BUILD_NUMBER count commits, a shallow clone counts 1.
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx electron-builder build --${{ matrix.platform }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.tar.gz
          if-no-files-found: warn

  # Create a GitHub Release with all desktop app binaries + trigger pull-based deploy
  release:
    needs: [build-server, backend-image, electron]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Download all Electron artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          pattern: electron-*
          merge-multiple: true

      - name: Download server build artifact
        uses: actions/download-artifact@v4
        with:
          name: server-build
          path: dist-server/

      - name: Package server build
        run: mkdir -p release-assets && tar -czf release-assets/devilbox-dist.tar.gz -C dist-server/ .

      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: release-assets/

      - name: List release assets
        run: ls -la release-assets/ || echo "No assets found"

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DEViLBOX v${{ steps.version.outputs.version }} (Latest Build)"
          body: |
            **Automatically built from the latest `main` branch.**

            This release is updated on every deploy. Download the installer for your platform below.

            | Platform | Files |
            |----------|-------|
            | Windows | `.exe` (installer) or `.zip` (portable) |
            | macOS | `.dmg` (disk image) or `.zip` |
            | Linux | `.AppImage`, `.deb`, or `.tar.gz` |

            ---
            Built from commit ${{ github.sha }}
          files: release-assets/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger deploy webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          curl -s -X POST https://devilbox.uprough.net/_webhook/hooks/deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${DEPLOY_SECRET}" \
            -d '{"sha":"${{ github.sha }}"}' \
            --max-time 30 || echo "Webhook trigger failed (non-fatal)"
