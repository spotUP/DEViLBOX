# FME-7 (mapper 69) player for the FamiStudio sound engine, 64 KB PRG of 8 KB banks.
# Banks 0-2 are filler; banks 3-7 sit at $6000-$FFFF in bank order (player.s fs_fme7tab), so file offset = 16 + CPU address.
# Music $6000-$BFFF (24 KB contiguous), DPCM $C000 (FAMISTUDIO_DPCM_OFF), engine + player code at the fixed $E000 bank.
MEMORY {
  ZP:   start=$0000, size=$0100, type=rw;
  RAM:  start=$0300, size=$0500, type=rw;
  HDR:  start=$0000, size=16, fill=yes, file=%O;
  FILL: start=$0000, size=$6000, fill=yes, fillval=$ff, file=%O;
  PRG:  start=$6000, size=$A000, fill=yes, fillval=$ff, file=%O;
  CHR:  start=$0000, size=$2000, fill=yes, file=%O;
}
SEGMENTS {
  ZEROPAGE: load=ZP, type=zp;
  BSS:      load=RAM, type=bss;
  HEADER:   load=HDR, type=ro;
  MUSIC:    load=PRG, type=ro, start=$6000;
  DPCM:     load=PRG, type=ro, start=$C000;
  CODE:     load=PRG, type=ro, start=$E000;
  VECTORS:  load=PRG, type=ro, start=$FFFA;
  CHARS:    load=CHR, type=ro;
}
